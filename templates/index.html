<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môj E-shop</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; color: #333; }
        header { background: #333; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header a { color: white; text-decoration: none; margin-left: 20px; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
        .price { font-size: 18px; font-weight: bold; color: #27ae60; margin: 10px 0; }
        .btn { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { background: #2980b9; }
        .btn-disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>Môj E-shop</h1>
        <nav>
            <a href="/">Domov</a>
            <a href="/cart">Košík ({{ cart_count }})</a>
            <a href="/admin">Admin</a>
        </nav>
    </header>
    
    <div class="container">
        <h2>Ponuka produktov</h2>
        <div class="products-grid">
            {% for prod in products %}
            <div class="product-card">
                {% if prod[5] %}
                    <img src="{{ prod[5] }}" alt="{{ prod[1] }}">
                {% else %}
                    <div style="height: 150px; background: #eee; display: flex; align-items: center; justify-content: center; color: #999;">Bez obrázka</div>
                {% endif %}
                <h3>{{ prod[1] }}</h3>
                <div class="price">{{ prod[2] }} €</div>
                <p>Skladom: {{ prod[3] }} ks</p>
                
                {% if prod[3] > 0 %}
                    <form action="/cart/add/{{ prod[0] }}" method="POST">
                        <button type="submit" class="btn">Pridať do košíka</button>
                    </form>
                {% else %}
                    <button class="btn btn-disabled" disabled>Vypredané</button>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
