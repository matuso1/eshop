<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Prihlásenie - Administrácia</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f7; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        h2 { margin-top: 0; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        .error { color: #e74c3c; font-size: 14px; text-align: center; margin-bottom: 10px; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #2980b9; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Admin Prihlásenie</h2>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label>Meno:</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Heslo:</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Prihlásiť sa</button>
        </form>
        
        <a href="/" class="back-link">← Späť do e-shopu</a>
    </div>
</body>
</html>
