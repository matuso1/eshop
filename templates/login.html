<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prihlásenie - Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 24px;
            color: #333;
        }
        .google-btn {
            display: inline-block;
            background-color: #4285F4;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .google-btn:hover {
            background-color: #3367D6;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Admin Prihlásenie</h2>
        <p style="color: #666; margin-bottom: 24px; font-size: 14px;">Pre prístup do administrácie sa prihláste cez svoj Google účet.</p>
        
        <a href="/auth/google" class="google-btn">Prihlásiť sa cez Google</a>
        
        <a href="/" class="back-link">&larr; Späť na hlavnú stránku e-shopu</a>
    </div>

</body>
</html>
